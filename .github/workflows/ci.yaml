name: CI
on:
  pull_request:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: oxalate-portal
  IMAGE_NAME: ${{ github.repository }}

concurrency: build

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up NodeJS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      # Corepack honours the packageManager pin in package.json; do not hardcode a version here.
      - name: Set up Yarn
        run: |
          corepack enable

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: ESLint
        run: |
          yarn lint

      # Formatting, type errors and inline lint suppressions are ratcheted rather than gated at
      # zero, because the repository does not conform today. See quality-baseline.json.
      - name: Quality ratchet
        run: |
          yarn ratchet

      - name: Translation parity
        run: |
          yarn verify:translations

      # No --passWithNoTests: a run that collects zero tests is a broken run, not a pass.
      # Coverage thresholds live in jest.config.cjs and fail the job when breached.
      - name: Test and coverage
        run: |
          yarn test:coverage

      - name: Build
        run: |
          yarn build:test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: coverage/**
          if-no-files-found: warn

  version-and-upload:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up NodeJS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      # Corepack honours the packageManager pin in package.json; do not hardcode a version here.
      - name: Set up Yarn
        run: |
          corepack enable

      - name: Get main and base version
        id: basemain
        shell: bash
        run: |
          baseVersion=$(cat VERSION)
          mainVersion=$(echo ${baseVersion} | cut -d '.' -f 1)
          echo "baseVersion=${baseVersion}" >> $GITHUB_OUTPUT
          echo "mainVersion=${mainVersion}" >> $GITHUB_OUTPUT

      - name: Generate new version
        id: newVer
        shell: bash
        run: |
          git fetch --tags origin
          currentVersion=$(git tag --list --sort=-version:refname "${baseVersion}.*" | head -n 1 || "${baseVersion}.0")

          if [ -z "${currentVersion}" ]; then
            newVersion="${baseVersion}.0"
          else
            runningNumber=$(echo ${currentVersion} | cut -f 3 -d '.')
            newVersion="${baseVersion}.$((${runningNumber} + 1))"
          fi
          echo "The generated new version is: ${newVersion}"
          echo "newVersion=${newVersion}" >> $GITHUB_OUTPUT
        env:
          baseVersion: ${{ steps.basemain.outputs.baseVersion }}

      - name: Set new version
        shell: bash
        # Replace the default version in package.json with the new version
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"${newVersion}\"/g" package.json
        env:
          newVersion: ${{ steps.newVer.outputs.newVersion }}

      - name: Build production package
        run: |
          yarn install --immutable
          yarn prebuild "${newVersion}"
          yarn env-cmd -f .env.production vite build
        env:
          newVersion: ${{ steps.newVer.outputs.newVersion }}

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to registry
        shell: bash
        run: |
          imgName="${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          docker build . --tag ${imgName}:latest
          echo "Setting versions to: '${mainVersion}', '${baseVersion}', '${newVersion}'"
          docker image tag ${imgName}:latest ${imgName}:${mainVersion}
          docker image tag ${imgName}:latest ${imgName}:${baseVersion}
          docker image tag ${imgName}:latest ${imgName}:${newVersion}
          docker push --all-tags ${imgName}
        env:
          mainVersion: ${{ steps.basemain.outputs.mainVersion }}
          baseVersion: ${{ steps.basemain.outputs.baseVersion }}
          newVersion: ${{ steps.newVer.outputs.newVersion }}

      - name: Create tag
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.TAG_CREATION_TOKEN }}
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.newVer.outputs.newVersion }}',
              sha: context.sha
            })

      - name: Create GitHub Release
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.TAG_CREATION_TOKEN }}
          script: |
            const tag = '${{ steps.newVer.outputs.newVersion }}';
            const resp = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: `Automated release for ${tag}

              Docker tags pushed:
              - latest
              - ${{ steps.basemain.outputs.mainVersion }}
              - ${{ steps.basemain.outputs.baseVersion }}
              - ${tag}
              `,
              draft: false,
              prerelease: false,
              generate_release_notes: true
            });
            core.info(`Release created: ${resp.data.html_url}`);